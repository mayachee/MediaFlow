<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scripts Studio — Your production workspace</title>
  <link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script>
</head>
<body>
<svg class="sprite" aria-hidden="true"><defs>
<symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
<symbol id="video" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4Z"/></symbol>
<symbol id="crop" viewBox="0 0 24 24"><path d="M5 3v14a2 2 0 0 0 2 2h14M3 5h14a2 2 0 0 1 2 2v14M9 9h6v6H9Z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="17" cy="16" rx="3" ry="3"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="clean" viewBox="0 0 24 24"><path d="m15 3-6 9m-4 1 7-2 6 5-4 5-8-1-3-3Zm4 1-3 6m12-15 1-3m0 3 3 1"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></symbol>
<symbol id="upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></symbol>
<symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
<symbol id="code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
<symbol id="spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></symbol>
</defs></svg>
<aside class="sidebar" id="sidebar">
  <a class="brand" href="#home"><span class="brand-icon"><svg><use href="#video"/></svg></span><span>Scripts<span class="brand-light">Studio</span><small>PRODUCTION WORKSPACE</small></span></a>
  <button class="new-button" data-tool="video"><svg><use href="#video"/></svg>Create a video<svg class="end-icon"><use href="#arrow"/></svg></button>
  <span class="nav-caption">WORKSPACE</span>
  <nav aria-label="Main navigation">
    <button data-page="home" class="nav-item active"><svg><use href="#home"/></svg>Overview</button>
    <button data-page="tools" class="nav-item"><svg><use href="#grid"/></svg>All tools<span id="tool-count" class="nav-count"></span></button>
    <button data-page="history" class="nav-item"><svg><use href="#clock"/></svg>Activity & results</button>
  </nav>
  <span class="nav-caption">CREATE & EDIT</span>
  <nav aria-label="Production tools">
    <button data-tool="clips-auto" class="nav-item"><svg><use href="#search"/></svg>Find &amp; download clips</button>
    <button data-tool="autocrop" class="nav-item"><svg><use href="#crop"/></svg>YouTube & Shorts</button>
    <button data-category="Clip library" class="nav-item"><svg><use href="#search"/></svg>Clip library</button>
    <button data-category="Video & audio" class="nav-item"><svg><use href="#music"/></svg>Music & audio</button>
    <button data-category="Search & publishing" class="nav-item"><svg><use href="#upload"/></svg>Publishing</button>
  </nav>
  <span class="nav-caption">MANAGE</span>
  <nav aria-label="Workspace management">
    <button data-page="cleaner" class="nav-item"><svg><use href="#clean"/></svg>Workspace cleaner</button>
    <button data-page="scripts" class="nav-item"><svg><use href="#code"/></svg>Script explorer</button>
  </nav>
  <div class="sidebar-bottom"><div class="workspace-avatar">S</div><div><strong>Local workspace</strong><small id="connection">Connecting…</small></div><button id="quit" class="icon-button" title="Quit Studio" aria-label="Quit Studio"><svg><use href="#close"/></svg></button></div>
</aside>
<div class="shell">
  <header class="topbar"><button id="menu" class="mobile-menu icon-button" aria-label="Toggle navigation"><svg><use href="#grid"/></svg></button><div class="breadcrumb">Workspace <span>/</span> <strong id="breadcrumb">Overview</strong></div><label class="global-search"><svg><use href="#search"/></svg><input id="global-search" placeholder="Find a tool…" aria-label="Find a tool"><kbd>Ctrl K</kbd></label><button id="open-results" class="top-button"><svg><use href="#folder"/></svg>Open results</button></header>
  <main id="main" tabindex="-1"><div class="loading">Connecting to your workspace…</div></main>
  <button id="running-bar" class="running-bar hidden"><span class="pulse"></span><strong id="running-title">Job running</strong><span id="running-time"></span><span>View activity →</span></button>
</div>
<dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button id="close-modal" class="icon-button" aria-label="Close dialog"><svg><use href="#close"/></svg></button></div><div id="modal-content"></div></dialog>
<div id="toast" role="status" class="toast hidden"></div>
</body></html>
